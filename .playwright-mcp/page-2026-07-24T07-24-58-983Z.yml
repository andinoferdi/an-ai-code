            - paragraph [ref=f5e166]: The internet is a global network of interconnected computers that communicate using standardized protocols. At its core, data is broken down into small units called packets, which travel independently across the network. Each packet contains a payload (the actual data being transmitted) and headers with metadata like source and destination addresses. This packet-switched approach allows efficient use of network resources, as packets from different conversations can share the same pathways without interfering with each other.
            - paragraph [ref=f5e167]: When you send data across the internet, it first gets segmented into packets at your device. Each packet is assigned a source IP address (your device's identifier) and a destination IP address (the target server). Routers—specialized computers that direct traffic—examine these IP addresses in the packet headers to determine the best path forward. This process, called routing, happens at the network layer and uses routing tables to make decisions based on current network conditions and topology.
            - paragraph [ref=f5e168]: The Domain Name System (DNS) solves the problem of human-memorable names versus machine-readable IP addresses. When you type a URL like "example.com" into your browser, your device queries DNS servers to translate this name into an IP address like "93.184.216.34." DNS operates as a hierarchical distributed database, with root servers, top-level domain servers, and authoritative name servers working together to resolve queries efficiently. This translation happens in milliseconds, making it appear seamless to users.
            - paragraph [ref=f5e203]: The Transmission Control Protocol (TCP) provides reliable, ordered delivery of data between applications. Before data transfer begins, TCP establishes a connection through a three-way handshake (SYN, SYN-ACK, ACK). During transmission, TCP ensures all packets arrive correctly by using sequence numbers, acknowledgments, and error checking. If packets are lost or corrupted, TCP retransmits them and may slow down transmission to maintain reliability. This reliability comes at the cost of some speed compared to the simpler User Datagram Protocol (UDP).
            - paragraph [ref=f5e204]: When you visit a website, your browser uses the HTTP (Hypertext Transfer Protocol) to communicate with the web server. HTTP defines the format and meaning of requests (GET, POST, PUT, DELETE) and responses (200 OK, 404 Not Found, 500 Internal Server Error). Your browser sends an HTTP request asking for a specific resource (like an HTML page), and the server responds with the requested content along with metadata about the resource. HTTP/1.1 added persistent connections, while HTTP/2 introduced multiplexing to improve performance.
            - paragraph [ref=f5e205]: Transport Layer Security (TLS) encrypts HTTP traffic to protect it from eavesdropping and tampering. When you visit a secure website (https://), your browser and the server perform a TLS handshake to establish a secure session. This involves exchanging cryptographic keys and certificates to verify authenticity. Once established, all HTTP data is encrypted using symmetric encryption, making it unreadable to anyone who intercepts the traffic. Modern TLS implementations use strong cipher suites and are regularly updated to address vulnerabilities.
            - paragraph [ref=f5e206]: The complete journey of a web request involves multiple layers working together. When you enter a URL, your device first uses DNS to resolve the domain name to an IP address. Then TCP establishes a connection with the server, followed by a TLS handshake if using HTTPS. Your browser sends an HTTP request, the server processes it and sends back an HTTP response containing the web page. This response may include additional resources (images, scripts, stylesheets) that trigger new requests, all following the same process.
            - paragraph [ref=f5e207]: The internet's resilience comes from its distributed architecture and redundancy. No single point of failure can bring down the entire network because data can be rerouted through alternative paths. Network providers interconnect through peering arrangements, and content delivery networks (CDNs) cache content closer to users. This combination of packet switching, intelligent routing, and layered protocols creates a robust system capable of handling billions of simultaneous connections while adapting to failures and congestion in real-time.
